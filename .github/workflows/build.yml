name: Build Saarthi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SAARTHI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/saarthi.jks"
            echo "SAARTHI_KEYSTORE_PATH=$RUNNER_TEMP/saarthi.jks" >> "$GITHUB_ENV"
            echo "Signing with the permanent Saarthi key."
          else
            echo "::warning::No signing key in secrets yet. This build uses a temporary key and cannot update other builds."
          fi

      - name: Build the app
        env:
          SAARTHI_KEYSTORE_PASSWORD: ${{ secrets.SAARTHI_KEYSTORE_PASSWORD }}
          SAARTHI_KEY_ALIAS: saarthi
        shell: bash
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Save the build log if it failed
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          git init -q && git checkout -q -b build-logs
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 "$GITHUB_WORKSPACE/build.log" | head -200 > errors.txt || true
          tail -300 "$GITHUB_WORKSPACE/build.log" > build-tail.txt
          git -c user.name="Saarthi build" -c user.email="build@saarthi.local" add .
          git -c user.name="Saarthi build" -c user.email="build@saarthi.local" commit -q -m "Build ${{ github.run_number }} failed"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-logs

      - name: Name the app file
        run: |
          VERSION=$(grep -oP 'versionName = "\K[0-9]+\.[0-9]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "saarthi-$VERSION.${{ github.run_number }}.apk"

      - name: Publish for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Saarthi build ${{ github.run_number }}
          body: |
            Download the .apk file below on your phone and open it to install.
            Built from commit ${{ github.sha }}.
          files: saarthi-*.apk
          make_latest: "true"
